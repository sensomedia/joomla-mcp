COM_SENSOMCP_LIST_CHANGED_SSE_DESC="Quand la liste d'outils d'une connexion est périmée et que le client accepte les flux d'événements, répondre en flux SSE portant la notification MCP « notifications/tools/list_changed » avant la réponse, pour inviter le client à recharger ses outils. À laisser désactivé sauf pour tester la réaction de votre client MCP."
