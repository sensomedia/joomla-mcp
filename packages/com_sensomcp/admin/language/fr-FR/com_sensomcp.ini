COM_SENSOMCP_STALE_ASSUMED_DESC="Connexion établie avant l'existence du suivi : la liste chargée est supposée être le catalogue au moment de son premier appel après la mise à jour."
COM_SENSOMCP_STALE_REVOKE_BTN="Révoquer"
