COM_SENSOMCP_STALE_CONNECTIONS="Connexions avec une liste d'outils périmée"
COM_SENSOMCP_STALE_CONNECTIONS_INTRO="Ces connexions MCP ont chargé leur liste d'outils avant que des outils soient ajoutés ou modifiés sur ce site. L'assistant est prévenu à son prochain appel d'outil ; l'utilisateur doit déconnecter puis reconnecter le connecteur (claude.ai : réglages du connecteur &rarr; Déconnecter, puis Connecter) pour voir les nouveaux outils. Révoquer une connexion OAuth force cette réauthentification."
