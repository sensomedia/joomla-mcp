PLG_SYSTEM_SENSOMCPCHANGELOG="Système - Senso MCP Changelog"
PLG_SYSTEM_SENSOMCPCHANGELOG_XML_DESCRIPTION="Sert dynamiquement le changelog.xml Joomla depuis les données de release du store (alimente la vue « Mettre à jour » via changelogurl), avec mise en cache native Joomla. Fournit aussi le parseur de changelog partagé utilisé par l'écran de résultat d'installation/mise à jour."
PLG_SYSTEM_SENSOMCPCHANGELOG_CACHING_LABEL="Mettre en cache le changelog.xml"
PLG_SYSTEM_SENSOMCPCHANGELOG_CACHING_DESC="Met en cache le changelog.xml généré via le cache natif de Joomla. Recommandé : l'endpoint est sollicité en polling par le gestionnaire de mises à jour de chaque site client."
PLG_SYSTEM_SENSOMCPCHANGELOG_CACHE_TIME_LABEL="Durée du cache (minutes)"
PLG_SYSTEM_SENSOMCPCHANGELOG_CACHE_TIME_DESC="Durée pendant laquelle un changelog.xml généré est servi depuis le cache avant d'être reconstruit depuis les données de release."
