PLG_TASK_SENSOMCP="Tâche - Maintenance Senso MCP"
PLG_TASK_SENSOMCP_XML_DESCRIPTION="Maintenance planifiée de Senso MCP : purge des codes OAuth expirés, des refresh tokens expirés/révoqués et des anciens journaux de requêtes."
PLG_TASK_SENSOMCP_CLEANUP_TITLE="Senso MCP : purge des jetons OAuth et des journaux"
PLG_TASK_SENSOMCP_CLEANUP_DESC="Supprime les codes d'autorisation OAuth expirés, les refresh tokens expirés ou révoqués, et les journaux de requêtes au-delà de la rétention configurée."
PLG_TASK_SENSOMCP_CLEANUP_LOG_RETENTION_LABEL="Rétention des journaux (jours)"
PLG_TASK_SENSOMCP_CLEANUP_LOG_RETENTION_DESC="Supprime les lignes du journal de requêtes MCP plus anciennes que ce nombre de jours. 0 = conserver indéfiniment."
PLG_TASK_SENSOMCP_CLEANUP_CLIENT_RETENTION_LABEL="Rétention des clients OAuth (jours)"
PLG_TASK_SENSOMCP_CLEANUP_CLIENT_RETENTION_DESC="Supprime les clients OAuth enregistrés dynamiquement sans jeton de rafraîchissement valide ni autorisation en attente, créés il y a plus de N jours. 0 = conservés indéfiniment."
PLG_TASK_SENSOMCP_CLEANUP_REFRESH_RETENTION_LABEL="Rétention des jetons de rafraîchissement utilisés (jours)"
PLG_TASK_SENSOMCP_CLEANUP_REFRESH_RETENTION_DESC="Conserve les jetons de rafraîchissement déjà utilisés pendant N jours, afin de détecter un jeton copié présenté à nouveau. 0 = supprimés à chaque exécution."
