PLG_TASK_SENSOMCP="Task - Manutenção do Senso MCP"
PLG_TASK_SENSOMCP_XML_DESCRIPTION="Manutenção agendada do Senso MCP: expurga códigos OAuth expirados, tokens de atualização expirados/revogados e logs de requisições antigos."
PLG_TASK_SENSOMCP_CLEANUP_TITLE="Senso MCP: expurgar tokens OAuth e logs"
PLG_TASK_SENSOMCP_CLEANUP_DESC="Exclui códigos de autorização OAuth expirados, tokens de atualização expirados ou revogados e logs de requisições mais antigos que a retenção configurada."
PLG_TASK_SENSOMCP_CLEANUP_LOG_RETENTION_LABEL="Retenção de logs (dias)"
PLG_TASK_SENSOMCP_CLEANUP_LOG_RETENTION_DESC="Exclui as linhas de log de requisições MCP mais antigas que este número de dias. Defina como 0 para manter os logs para sempre."
PLG_TASK_SENSOMCP_CLEANUP_CLIENT_RETENTION_LABEL="Retenção de clientes OAuth (dias)"
PLG_TASK_SENSOMCP_CLEANUP_CLIENT_RETENTION_DESC="Remove clientes OAuth registrados dinamicamente sem refresh token válido nem autorização pendente, criados há mais de N dias. 0 = manter sempre."
PLG_TASK_SENSOMCP_CLEANUP_REFRESH_RETENTION_LABEL="Retenção de refresh tokens usados (dias)"
PLG_TASK_SENSOMCP_CLEANUP_REFRESH_RETENTION_DESC="Mantém os refresh tokens já usados por esses dias, para detectar um token copiado apresentado novamente. 0 os apaga a cada execução."
