PLG_TASK_SENSOMCP="Task - Senso MCP Wartung"
PLG_TASK_SENSOMCP_XML_DESCRIPTION="Geplante Wartung für Senso MCP: Löschen abgelaufener OAuth-Codes, abgelaufener/widerrufener Refresh-Token und alter Anfrageprotokolle."
PLG_TASK_SENSOMCP_CLEANUP_TITLE="Senso MCP: OAuth-Token und Protokolle löschen"
PLG_TASK_SENSOMCP_CLEANUP_DESC="Löscht abgelaufene OAuth-Autorisierungscodes, abgelaufene oder widerrufene Refresh-Token sowie Anfrageprotokolle, die älter als die konfigurierte Aufbewahrung sind."
PLG_TASK_SENSOMCP_CLEANUP_LOG_RETENTION_LABEL="Protokoll-Aufbewahrung (Tage)"
PLG_TASK_SENSOMCP_CLEANUP_LOG_RETENTION_DESC="Zeilen des MCP-Anfrageprotokolls löschen, die älter als so viele Tage sind. Auf 0 setzen, um Protokolle unbegrenzt aufzubewahren."
PLG_TASK_SENSOMCP_CLEANUP_CLIENT_RETENTION_LABEL="Aufbewahrung OAuth-Clients (Tage)"
PLG_TASK_SENSOMCP_CLEANUP_CLIENT_RETENTION_DESC="Löscht dynamisch registrierte OAuth-Clients ohne gültiges Refresh-Token und ohne ausstehende Autorisierung, die älter als N Tage sind. 0 = unbegrenzt aufbewahren."
