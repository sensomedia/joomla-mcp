PLG_TASK_SENSOMCP_CLEANUP_CLIENT_RETENTION_DESC="Verwijdert dynamisch geregistreerde OAuth-clients zonder geldig refresh-token en zonder openstaande autorisatie, ouder dan N dagen. 0 = altijd bewaren."
