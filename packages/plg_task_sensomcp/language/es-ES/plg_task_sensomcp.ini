PLG_TASK_SENSOMCP="Task - mantenimiento de Senso MCP"
PLG_TASK_SENSOMCP_XML_DESCRIPTION="Mantenimiento programado de Senso MCP: purga los códigos OAuth caducados, los refresh tokens caducados/revocados y los registros de solicitudes antiguos."
PLG_TASK_SENSOMCP_CLEANUP_TITLE="Senso MCP: purgar tokens OAuth y registros"
PLG_TASK_SENSOMCP_CLEANUP_DESC="Elimina los códigos de autorización OAuth caducados, los refresh tokens caducados o revocados y los registros de solicitudes más antiguos que la retención configurada."
PLG_TASK_SENSOMCP_CLEANUP_LOG_RETENTION_LABEL="Retención de registros (días)"
PLG_TASK_SENSOMCP_CLEANUP_LOG_RETENTION_DESC="Elimina las filas del registro de solicitudes MCP más antiguas que este número de días. Ponlo a 0 para conservar los registros indefinidamente."
PLG_TASK_SENSOMCP_CLEANUP_CLIENT_RETENTION_LABEL="Retención de clientes OAuth (días)"
PLG_TASK_SENSOMCP_CLEANUP_CLIENT_RETENTION_DESC="Elimina los clientes OAuth registrados dinámicamente sin token de actualización válido ni autorización pendiente, creados hace más de N días. 0 = conservar siempre."
